[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jithinkuma-resched_jd050"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出训练资源调度工程师·作业抢占与调度公平性上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jithinkuma" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jithinkuma.github.io"
Repository = "https://github.com/jithinkuma/resched_jd050"
Issues = "https://github.com/jithinkuma/resched_jd050/issues"

[project.scripts]
resched_jd050 = "resched_jd050:main"

[tool.setuptools]
py-modules = ["resched_jd050"]
